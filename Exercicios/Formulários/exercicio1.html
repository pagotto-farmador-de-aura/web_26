<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercicio 1</title>
</head>
<body>
    <form action="" method="post">
        <div class="form" style="display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2vh;">
            <label for="input_name">Digite o Seu Nome</label>
            <input type="text" name="form_name" id="input_name" placeholder="Ex.: Arthur" required>

            <label for="input_email">Digite o Seu Email</label>
            <input type="email" name="form_email" id="input_email" placeholder="Ex.: arthur.pagotto@outlook.com" required>

            <label for="input_subject">Digite o Assunto do Email</label>
            <input type="text" name="form_subject" id="input_subject" placeholder="Ex.: Gatinhos">

            <label for="input_message">Digite sua Mensagem</label>
            <textarea name="form_message" id="input_message" cols="25" rows="5"></textarea>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </div>
    </form>
</body>
</html>
