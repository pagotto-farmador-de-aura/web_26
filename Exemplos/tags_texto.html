<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tags de Texto</title>
</head>
<body>
    <h1>Título 1</h1>
    <h2>Título 2</h2>
    <h3>Título 3</h3>
    <h4>Título 4</h4>
    <h5>Título 5</h5>
    <h6>Título 6</h6>
    <hr>
    <p>Parágrafo</p>
    <hr>
    <!-- Comentário -->
    <p>
        Primeira Linha<br>
        Segunda Linha
    </p>

    <hr>

    <h2>Lista Não Ordenada</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <hr>

    <h2>Lista Ordenada</h2>
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>

    <hr>

    <a href="https://www.google.com" title="Clica Aqui Fi">Google</a>
    <a href="https://www.google.com" target="_blank">Google Nova Aba</a>
</body>
</html>
